<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>FoFocaccia Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one sticky brand bar + scrollable tab strip, then a single working view. Olive/cream like the workbook; data in tabular numerals. */
:root{
  --bg:#f6f2ea; --panel:#fffdf8; --panel2:#f0ebe0; --line:#d9d1bf; --fg:#2b2a24; --muted:#6e6a5c;
  --olive:#4a5c2a; --olive-2:#6b7f4f; --gold:#c9a84c; --red:#b3372a; --green:#1e8449; --orange:#d97b1e;
  --sage:#c8d5a3; --inp:#fffbe6; --inpfg:#0c3fb8; --display:"Fraunces",Georgia,serif; --body:"Public Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1c16; --panel:#24261d; --panel2:#2d3024; --line:#434636; --fg:#ece7d8; --muted:#a39f8f;
  --olive:#9bb06c; --olive-2:#7d9154; --gold:#d8b85e; --red:#e2705f; --green:#5fc08a; --orange:#eb9a4a; --sage:#3f4a2b; --inp:#2f3221; --inpfg:#9cc0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1c16; --panel:#24261d; --panel2:#2d3024; --line:#434636; --fg:#ece7d8; --muted:#a39f8f;
  --olive:#9bb06c; --olive-2:#7d9154; --gold:#d8b85e; --red:#e2705f; --green:#5fc08a; --orange:#eb9a4a; --sage:#3f4a2b; --inp:#2f3221; --inpfg:#9cc0ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;margin:0}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--olive);color:#fff;padding:10px 16px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:22px;color:#fff}
.brand small{opacity:.8}
.brand .st{margin-left:auto;font-size:12px;opacity:.85}
.brand #xlsBtn,.brand #outBtn{margin-bottom:0}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;background:transparent;border:0;color:#fff;opacity:.75;padding:8px 12px;border-radius:8px 8px 0 0;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--bg);color:var(--fg);opacity:1}
.tabs button:focus-visible{outline:2px solid var(--gold)}
main{padding-block:16px 48px;padding-inline:16px;max-width:1500px;margin:0 auto}
.sub{color:var(--muted);font-size:13px;margin:4px 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.btn{background:var(--olive);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--red)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;max-width:100%}
input.in,select.in,textarea.in{background:var(--inp);color:var(--inpfg)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
th{background:var(--olive);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px;text-align:left;position:sticky;top:0;white-space:nowrap}
td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.n,th.n{text-align:right}
tr.tot td{background:var(--panel2);font-weight:700}
tr.sec td{background:var(--sage);color:var(--fg);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr.key td{background:var(--gold);color:#2b2a24;font-weight:700}
td input,td select{width:100%;padding:4px 6px}
td input[type=number]{width:84px;text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.card .v{font-family:var(--display);font-size:24px;font-weight:700;color:var(--olive);font-variant-numeric:tabular-nums}
.card .v.small{font-size:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;min-width:0}
.panel h2{font-size:18px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
.ok{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--orange)}
.pill.ok{background:color-mix(in srgb,var(--green) 18%,transparent)} .pill.bad{background:color-mix(in srgb,var(--red) 18%,transparent)} .pill.warn{background:color-mix(in srgb,var(--orange) 18%,transparent)}
.neg{color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(20,20,10,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:20}
.modal .box{background:var(--panel);border-radius:12px;padding:18px;width:min(760px,100%);border:1px solid var(--line)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.form .wide{grid-column:1/-1}
.items-edit{grid-column:1/-1;display:grid;gap:6px}
.items-edit .ln{display:grid;grid-template-columns:1fr 80px 32px;gap:6px}
.items-edit .ln.cust{grid-template-columns:1fr 110px 32px;background:var(--panel2);padding:6px;border-radius:6px;margin-top:-2px}
.items-edit .ln.cust .note{align-self:center}
.block{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.block .hd{background:var(--olive);color:#fff;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.block .hd h3{color:#fff;font-size:16px}
.block .bd{padding:10px 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;align-items:center}
.chart{width:100%;height:auto;display:block}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--olive);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:30}
.x{background:none;border:0;color:var(--red);font-size:16px;cursor:pointer}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:600px){.card .v{font-size:20px} main{padding-inline:16px}}
@media (prefers-reduced-motion:no-preference){.tabs button{transition:background .15s}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel,transparent)}.seg button{border:0;background:transparent;color:var(--muted);padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}.seg button.on{background:var(--olive-2);color:#fff}.seg button+button{border-left:1px solid var(--line)}
.hb{display:grid;gap:6px}.hb-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr 70px;align-items:center;gap:8px;font-size:13px}.hb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb-bar{height:12px;background:color-mix(in srgb,var(--line) 60%,transparent);border-radius:6px;overflow:hidden}.hb-bar i{display:block;height:100%;border-radius:6px}.hb-v{text-align:right;font-variant-numeric:tabular-nums}.hb-v.neg{color:var(--red)}
.alerts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.alerts button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--fg)}.alerts button.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}.alerts button.warn{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,transparent)}
table.heat td,table.heat th{padding:5px 6px;font-size:12px;text-align:center}.goalbar{height:14px;border-radius:7px;background:color-mix(in srgb,var(--line) 60%,transparent);overflow:hidden;position:relative}.goalbar i{display:block;height:100%;background:var(--olive-2)}.goalbar s{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);text-decoration:none}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.mini .card{padding:8px 10px}.mini .card .v{font-size:18px}
</style>

</head>
<body>
<div class="top">
  <div class="brand"><h1>🫓 FoFocaccia</h1><small>business tracker &amp; accounts</small><span class="st" id="status">loading…</span><button class="btn sec" id="xlsBtn" style="padding:4px 10px;font-size:12px" title="Download everything as an Excel workbook">⬇ Excel</button><button class="btn sec" id="outBtn" style="padding:4px 10px;font-size:12px" hidden>Sign out</button></div>
  <div class="tabs" id="tabs"></div>
</div>
<main id="view"><div class="empty">Loading your data…</div></main>
<div id="modalHost"></div>

    // C. weekday

    const named = so.filter(o=>o.customer); const returning = named.filter(o=>first[o.customer.toLowerCase()] < o.date);
    const repeatRate = named.length? returning.length/named.length : null;
    const newRet = dash.months.map(mo=>{ const os = named.filter(o=>o.m===mo.key); const ret = os.filter(o=>first[o.customer.toLowerCase()] < o.date).length; return {label:mo.label, ret, nw: os.length-ret}; });
    const spend = {}; so.forEach(o=>{ if(!o.customer) return; const k=o.customer; spend[k] = spend[k]||{name:k, rev:0, n:0}; spend[k].rev+=o.total; spend[k].n++; });
    const topCust = Object.values(spend).sort((a,b)=>b.rev-a.rev).slice(0,5);
    const life = {}; dated.forEach(o=>{ if(!o.customer) return; const k=o.customer.toLowerCase(); life[k] = life[k]||{name:o.customer, n:0, spent:0, last:""}; life[k].n++; life[k].spent+=o.total; if (o.date>life[k].last) life[k].last=o.date; });
    const quiet = Object.values(life).map(c=>({...c, days: Math.round((new Date(t0+"T00:00:00Z")-new Date(c.last+"T00:00:00Z"))/864e5), id: (S.customers.find(x=>(x.name||"").toLowerCase()===c.name.toLowerCase())||{}).id})).filter(c=>c.n>=2 && c.days>=45).sort((a,b)=>b.spent-a.spent).slice(0,8);

      mix[rg] = (mix[rg]||0)+q*px; const key = i.label; perItem[key] = perItem[key]||{name:key, units:0, rev:0, con:0}; perItem[key].units+=q; perItem[key].rev+=q*px; perItem[key].con += q*(m? m.con : px); }));
    const mixList = Object.entries(mix).map(([label,rev])=>({label,rev})).sort((a,b)=>b.rev-a.rev);

      var heat = {mode:"hour", cols: hours.map(h=>({key:h, label:(h%12||12)+(h<12?"a":"p")})), rows: DOW.map((d,i)=>({label:d, key:i})), get:(r,c)=>hm[r+":"+c]||0, n: timed.length, note:"Orders by weekday and hour (orders with a time recorded)"}; }
    else { so.forEach(o=>{ const d = new Date(o.date+"T00:00:00Z").getUTCDay(); const w = Math.min(5, Math.ceil(parseInt(o.date.slice(8,10))/7)); hm[d+":"+w] = (hm[d+":"+w]||0)+1; });
      var heat = {mode:"week", cols: [1,2,3,4,5].map(w=>({key:w, label:"Wk "+w})), rows: DOW.map((d,i)=>({label:d, key:i})), get:(r,c)=>hm[r+":"+c]||0, n: so.length, note:"Orders by weekday and week of the month. Record a time on orders (Cashier / order form) and this becomes weekday × hour."}; }

    const occ = {}; so.forEach(o=>{ if (o.occasion){ occ[o.occasion] = occ[o.occasion]||{label:o.occasion, rev:0, n:0}; occ[o.occasion].rev+=o.net; occ[o.occasion].n++; } });
    const occList = Object.values(occ).sort((a,b)=>b.rev-a.rev);

  })();

}

function saveConfig(key){ // debounced per doc

    const body = key==="settings" ? S.settings : (key==="goals" ? {months:S.goals} : {items:S[key]});

function applySeed(){ // when nothing has been stored anywhere yet, start from the FoFocaccia menu, recipes, boxes and ingredients
  const filled = [];
  if (!S.settings){ S.settings = JSON.parse(JSON.stringify(SEED.settings)); filled.push("settings"); }
  for (const k of ["ingredients","recipes","boxes","menu"]) if (!S[k].length){ S[k] = JSON.parse(JSON.stringify(SEED[k].items)); filled.push(k); }
  if (S.dbOn && S.canWrite) filled.forEach(k => saveConfig(k));
  if (!S.dbOn){ // local copy: bring an older saved menu up to date without losing the user's own items
    const has = n => S.menu.some(m=>(m.name||"").toLowerCase()===n.toLowerCase());
    const nb = S.menu.find(m=>m.name==="Nonna's Box"); if (nb && !has("Mamma's Basket")){ nb.name="Mamma's Basket"; nb.range="Gathering Basket"; const bx = S.boxes.find(b=>b.name==="Nonna's Box"); if (bx) bx.name="Mamma's Basket"; }
    const wf = S.menu.find(m=>m.name==="Whipped Feta Cheese"); if (wf && N(wf.price)===20) wf.price = 25;
    let changed = false; SEED.menu.items.forEach(m=>{ if (!has(m.name)){ S.menu.push({...m}); changed = true; } });
    S.menu = S.menu.filter(m=>!(m.name==="New item" && !N(m.price)));

}
async function boot(){
  const tok = customerToken(); if (tok){ renderCustomer(tok); return; }
  const store = window.FofoStore;
  if (store && store.configured){ // shared mode: sign in first, then everything comes from the shared database
    $("#tabs").hidden = true; $("#xlsBtn").hidden = true; $("#status").textContent = "sign in to continue";
    const conn = await store.connect(); db = conn.db; user = conn.email; $("#tabs").hidden = false; $("#xlsBtn").hidden = false; $("#outBtn").hidden = false; render();
  } else { // no database configured: keep data in this browser only
    try { Object.keys(docs).forEach(k=>{ const v = localStorage.getItem("fofo."+k); if(v){ const b=JSON.parse(v); if(k==="settings") S.settings=b; else if(k==="goals") S.goals=b.months||{}; else S[k]=b.items||[]; } });
      ["orders","expenses","wastage","customers","filings"].forEach(k=>{ const v=localStorage.getItem("fofo."+k); if(v) S[k]=JSON.parse(v); }); } catch(e){}
    render();
  }
  if (db){ S.dbOn = true; S.canWrite = true;
    let pendingDocs = Object.keys(docs).length; // seed only once every config doc has answered and settings is truly absent
    const firstLoad = () => { if (pendingDocs<=0 || --pendingDocs>0) return; S.ready=true; if (!S.settings) applySeed(); render(); };
    Object.entries(docs).forEach(([k,p]) => db.doc(p).onSnapshot(snap => { if(snap.exists){ const b = JSON.parse(JSON.stringify(snap.data())); if(k==="settings") S.settings={...DEFAULT_SETTINGS,...b}; else if(k==="goals") S.goals=b.months||{}; else S[k]=b.items||[]; } if (pendingDocs>0) firstLoad(); else if (snap.exists) renderSoon(); }, e=>{ console.warn(k,e); if (pendingDocs>0) firstLoad(); }));
    ["orders","expenses","wastage","customers","filings"].forEach(c => db.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d=>({id:d.id, ...JSON.parse(JSON.stringify(d.data()))})); renderSoon(); }, e=>console.warn(c,e)));
    setTimeout(()=>{ if (!S.ready){ S.ready=true; render(); } }, 20000); // never seed on a timeout: a slow load must not overwrite saved data
  } else { S.ready=true; applySeed(); render(); }
}

      <label>Date<input class="in" id="c_date" type="date" value="${esc(r.date)}" ${issued?"disabled":""}></label>
      <label>Customer<input class="in" id="c_customer" list="cCust" autocomplete="off" value="${esc(r.customer)}" ${issued?"disabled":""}><datalist id="cCust">${known.map(k=>`<option value="${esc(k.name)}">`).join("")}</datalist></label>
      <label>Phone / WhatsApp<input class="in" id="c_phone" type="tel" value="${esc(r.phone)}" ${issued?"disabled":""}></label>
      <label>Paid into<select class="in" id="c_account" ${issued?"disabled":""}>${[...S.settings.accounts.map(a=>a.name), OWNER].map(a=>`<option ${a===r.account?"selected":""}>${esc(a)}</option>`).join("")}</select></label>
      <div class="items-edit"><div class="note">Items</div>${r.items.map((it,k)=>`<div class="ln"><select class="in" data-cit="${k}" ${issued?"disabled":""}><option value="">— choose item —</option>${C.menuList.map(m=>`<option value="${esc(m.name)}" ${!it.custom&&m.name===it.item?"selected":""}>${esc(m.name)} — ${m.price}</option>`).join("")}<option value="__custom" ${it.custom?"selected":""}>✎ Custom item…</option></select><input class="in" type="number" min="1" data-ciq="${k}" value="${it.qty||1}" ${issued?"disabled":""}><button class="x" type="button" data-cix="${k}" ${issued?"disabled":""}>✕</button></div>${it.custom?`<div class="ln cust"><input class="in" data-cin="${k}" placeholder="Custom item name" value="${esc(it.name||"")}" ${issued?"disabled":""}><input class="in" type="number" step="any" min="0" inputmode="decimal" data-cip="${k}" placeholder="Price SAR" value="${it.price?esc(it.price):""}" ${issued?"disabled":""}><span class="note" style="align-self:center">SAR</span></div>`:""}`).join("")}${issued?"":`<div><button class="btn sec" type="button" id="cAdd">+ item</button></div>`}</div>
      <label class="wide" style="flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:14px"><input type="checkbox" id="c_delivery" ${r.delivery!==false?"checked":""} ${issued?"disabled":""}> Delivery (${fmt0(C.DF)} SAR, no VAT) — untick for pickup</label>
      <label>Time (optional)<input class="in" id="c_time" type="time" value="${esc(r.time||"")}" ${issued?"disabled":""}></label>
      <label>Occasion (optional)<select class="in" id="c_occasion" ${issued?"disabled":""}>${["","Eid","Ramadan","Birthday","Corporate","Gift","Wedding / engagement","National Day","Other"].map(o=>`<option ${o===(r.occasion||"")?"selected":""}>${o}</option>`).join("")}</select></label>
      <label class="wide">Note on receipt (optional)<input class="in" id="c_notes" value="${esc(r.notes)}" ${issued?"disabled":""}></label>
      <label class="wide">Payment link for this customer (optional)<input class="in" id="c_payLink" type="url" inputmode="url" placeholder="https://…" value="${esc(r.payLink||"")}"></label>
      <div class="wide row" style="margin-top:4px">${issued? (canW()?`<button class="btn sec" type="button" id="cSavePay">Save link</button>`:"") : (canW()?`<button class="btn" type="submit">Save & number</button>`:"")}<button class="btn sec" type="button" id="cPng" ${issued?"":"disabled"}>⬇ PNG</button><button class="btn sec" type="button" id="cPdf" ${issued?"":"disabled"}>⬇ PDF</button><button class="btn sec" type="button" id="cLink" ${issued?"":"disabled"}>🔗 Customer link</button><button class="btn sec" type="button" id="cMsg" ${issued?"":"disabled"}>WhatsApp message</button><span style="flex:1"></span><button class="btn sec" type="button" id="cNew">New sale</button></div>
      ${issued? `<p class="note wide">Recorded as order ${esc(r.receiptNo)} on the Orders tab. To change it, edit it there.</p>` : `<p class="note wide">Save first to get a receipt number; downloads and links unlock after that.</p>`}
    </form></div>
    <div style="position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px)"><canvas id="rc" style="width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18);background:#fff"></canvas>
      <div class="kv" style="margin-top:10px;font-variant-numeric:tabular-nums"><span>Total before VAT</span><b style="text-align:right">${f2(R.net)}</b><span>VAT ${Math.round(R.rate*100)}%</span><b style="text-align:right">${f2(R.vat)}</b><span>Delivery</span><b style="text-align:right">${f2(R.fee)}</b><span>Total</span><b style="text-align:right">SAR ${f2(R.total)}</b></div></div></div>`; },
dash(){ const D=C.dash, X=C.dx, t=D.tot, b=C.bs(D.to+"-31"); const losing = C.menuList.filter(m=>m.status==="loses").length, below = C.menuList.filter(m=>m.status==="below").length;
  const be = (()=>{ const cm = t.rev? t.conPct : (C.menuList.length? C.menuList.reduce((a,m)=>a+(m.margin||0),0)/C.menuList.length:0); const fixed = t.opxT/t.monthsActive; return cm>0? fixed/cm : null; })();
  const top = (()=>{ const c={}; C.orders.filter(o=>o.m>=D.from && o.m<=D.to).forEach(o=>o.items.forEach(i=>{ if(!i.custom) c[i.item]=(c[i.item]||0)+(N(i.qty)||1); })); const e = Object.entries(c).sort((a,b)=>b[1]-a[1])[0]; return e? {name:e[0], units:e[1]} : null; })();
  const life = D.scope==="all"; const lbls = D.months.map((m,i)=> (D.months.length>18 && i%2) ? "" : m.label);
  return `<div class="row" style="align-items:center;gap:12px;flex-wrap:wrap"><h2 style="font-size:22px;margin:0">Dashboard</h2><span style="flex:1"></span><div class="seg">${[["all","Lifetime"],...D.fyYears.map(y=>[String(y),"FY "+y])].map(([k,l])=>`<button type="button" class="${String(D.scope)===k?"on":""}" data-scope="${k}">${l}</button>`).join("")}</div></div>
  <p class="sub">${life? `Lifetime: ${D.from} → ${D.to}, all sales since day one.` : `Financial year ${D.from} → ${D.to}.`} Everything here updates as you log orders and expenses.</p>
  ${X.alerts.length? `<div class="alerts">${X.alerts.map(a=>`<button type="button" class="${a.k}" data-go="${a.tab}">${a.k==="bad"?"⛔":a.k==="warn"?"⚠":"ℹ"} ${esc(a.t)}</button>`).join("")}</div>` : `<div class="alerts"><button type="button" class="ok" disabled>✓ No alerts</button></div>`}
  <div class="cards">${[["Net revenue (SAR)",fmt0(t.rev)],["Orders",int(t.orders)],["Contribution (SAR)",fmt0(t.con)],["Contribution margin",pct(t.conPct)],["Net profit (SAR)",fmt0(t.np)],["Avg order value",fmt0(t.aov)],[life?"Cash today":"Cash at year end",fmt0(b.accts.reduce((a,x)=>a+x.bal,0))],["Top item",top&&top.units? esc(top.name):"–"]].map(([l,v])=>`<div class="card"><div class="l">${l}</div><div class="v ${v.length>9?"small":""}">${v}</div></div>`).join("")}</div>
  <div class="panel"><h2>Momentum</h2><div class="tw"><table>${th(["Period","#Net revenue","#Orders","#Avg order","#Change",""])}
    ${X.periods.map((p,i)=>`<tr>${td(esc(p.label))}${n0(p.cur.rev)}${ni(p.cur.orders)}${n0(p.cur.aov)}${td(p.chg==null?"–":`<span class="${p.chg<0?"bad":"ok"}">${p.chg>=0?"+":""}${pct(p.chg)}</span>`,"n")}${td(`<span class="note">${esc(p.vs)}${i===0&&p.chgLY!=null?` · ${p.chgLY>=0?"+":""}${pct(p.chgLY)} vs last year`:""}</span>`)}</tr>`).join("")}</table></div>
    ${X.goal.goal? `<div style="margin-top:10px"><div class="row" style="justify-content:space-between;font-size:13px"><span>Month-to-date vs target: <b>${fmt0(X.goal.mtd)}</b> of ${fmt0(X.goal.goal)} (${pct(X.goal.pct)})</span><span class="note">day ${X.goal.dom}/${X.goal.dim} · on pace would be ${fmt0(X.goal.pace)} · ${fmt0(X.goal.left)} to go in ${X.goal.daysLeft} days</span></div><div class="goalbar" style="margin-top:4px"><i style="width:${Math.min(100,Math.round((X.goal.pct||0)*100))}%"></i><s style="left:${Math.round(X.goal.dom/X.goal.dim*100)}%"></s></div></div>` : `<p class="note" style="margin-top:8px">Set a revenue target for ${nowKey()} on the Goals tab to see month-to-date progress here.</p>`}</div>
  <div class="grid2"><div class="panel"><h2>Net revenue vs net profit${life?" — by month":""}</h2>${barChart([D.pl.map(r=>r.rev),D.pl.map(r=>r.np)],lbls,["var(--olive-2)","var(--gold)"])}<p class="note">Olive: net revenue · Gold: net profit</p></div>
  <div class="panel"><h2>Health checks</h2><div class="kv">
    <span>Owed by customers</span><b>${fmt0(b.recv)}</b><span>VAT owed to ZATCA</span><b>${fmt0(b.vatL)}</b><span>Menu items losing money</span><b class="${losing?"bad":""}">${losing}</b><span>Menu items below target margin</span><b class="${below?"warn":""}">${below}</b>
    <span>Break-even revenue / month</span><b>${be? fmt0(be):"n/a"}</b><span>Balance sheet</span><b class="${b.check===0?"ok":"bad"}">${b.check===0?"✓ Balanced":"⚠ Out of balance ("+fmt2(b.check)+")"}</b>
    <span>Next ZATCA deadline</span><b>${(()=>{ const d = C.deadlines.find(x=>!x.done); return d ? `${esc(d.what)} ${esc(d.period)} · ${d.due}${d.days<0?" <span class='bad'>(overdue)</span>":""}` : "–"; })()}</b><span>Orders missing an account</span><b>${C.orders.filter(o=>!o.account).length}</b><span>Wastage & variance (${life?"lifetime":"year"})</span><b>${fmt0(t.vari)}</b></div></div></div>
  <div class="grid2"><div class="panel"><h2>Sales by weekday</h2>${hbars(X.wd, x=>x.rev)}<p class="note">Net revenue per weekday (totals for this view${X.n?`, ${X.n} orders`:""}). Sat–Mon are your strongest days if the bars say so — plan bake days around them.</p></div>
  <div class="panel"><h2>Contribution margin by month</h2>${barChart([D.pl.map(r=>(r.conPct||0)*100)], lbls, ["var(--olive-2)"])}<p class="note">Contribution % of net revenue. A falling line usually means ingredient prices moved or the mix shifted to low-margin items.</p></div></div>
  <div class="grid2"><div class="panel"><h2>Customers</h2><div class="mini"><div class="card"><div class="l">Repeat rate</div><div class="v">${X.repeatRate==null?"–":pct(X.repeatRate)}</div></div><div class="card"><div class="l">Unique customers</div><div class="v">${int(X.uniq)}</div></div><div class="card"><div class="l">Delivered</div><div class="v">${X.delivery.share==null?"–":pct(X.delivery.share)}</div></div><div class="card"><div class="l">Delivery net (fees − cost)</div><div class="v ${X.delivery.net<0?"neg":""}">${fmt0(X.delivery.net)}</div></div></div>
    <h3 style="margin:12px 0 4px;font-size:14px">New vs returning orders</h3>${stackChart(X.newRet.map(x=>x.ret), X.newRet.map(x=>x.nw), lbls, ["var(--olive-2)","var(--gold)"])}<p class="note">Olive: returning customers · Gold: first-time customers. Repeat rate = share of orders from someone who had ordered before.</p></div>
  <div class="panel"><h2>Top customers</h2>${X.topCust.length? hbars(X.topCust, x=>x.rev) : `<p class="note">No named customers yet.</p>`}<p class="note">Spend incl. VAT in this view.</p>
    <h3 style="margin:14px 0 4px;font-size:14px">Gone quiet (45+ days, 2+ orders)</h3>${X.quiet.length? `<div class="tw"><table>${th(["Customer","Last order","#Days","#Orders","#Spent"])}${X.quiet.map(c=>`<tr ${c.id?`data-edit="customers:${c.id}" style="cursor:pointer"`:""}>${td(esc(c.name))}${td(c.last)}${ni(c.days)}${ni(c.n)}${n0(c.spent)}</tr>`).join("")}</table></div>` : `<p class="note">Nobody — all regulars have ordered recently.</p>`}</div></div>
  <div class="grid2"><div class="panel"><h2>Product mix by range</h2>${X.mixList.length? hbars(X.mixList, x=>x.rev) : `<p class="note">No sales in this view.</p>`}<p class="note">Net revenue (ex-VAT) by range.</p>${X.occList.length? `<h3 style="margin:14px 0 4px;font-size:14px">By occasion</h3>${hbars(X.occList, x=>x.rev)}` : `<p class="note">Tag orders with an occasion (Eid, Ramadan, corporate…) in the Cashier or order form and the split appears here.</p>`}</div>
  <div class="panel"><h2>Top items by contribution</h2>${X.topCon.length? hbars(X.topCon, x=>x.con) : `<p class="note">No sales in this view.</p>`}${X.worstCon.length? `<h3 style="margin:14px 0 4px;font-size:14px;color:var(--red)">Losing money</h3>${hbars(X.worstCon, x=>x.con)}`:""}<p class="note">Units × contribution per unit (price ex-VAT − ingredients − packaging). Custom items count at full price.</p></div></div>
  <div class="grid2"><div class="panel"><h2>Loaves per week (last 12 weeks)</h2>${barChart([X.weeks.map(w=>w.loaves)], X.weeks.map(w=>w.label), ["var(--olive-2)"])}<p class="note">Focaccia loaves sold per week (weeks start Sunday). Kitchen capacity is set on the Wastage tab.</p></div>
  <div class="panel"><h2>When orders come in</h2>${heatTable(X.heat)}<p class="note">${esc(X.heat.note)}</p></div></div>
  <div class="panel"><h2>Cash position today</h2><div class="mini"><div class="card"><div class="l">In the bank & till</div><div class="v">${fmt0(X.cash.cashNow)}</div></div><div class="card"><div class="l">VAT owed to ZATCA</div><div class="v neg">−${fmt0(X.cash.vatOwed)}</div></div><div class="card"><div class="l">Zakat accrued (est.)</div><div class="v neg">−${fmt0(X.cash.zakAcc)}</div></div><div class="card" style="border-color:var(--olive-2)"><div class="l">Actually yours</div><div class="v ${X.cash.yours<0?"neg":""}">${fmt0(X.cash.yours)}</div></div><div class="card"><div class="l">Owed by customers</div><div class="v">${fmt0(X.cash.recv)}</div></div></div><p class="note">${X.cash.accts.map(a=>esc(a.name)+" "+fmt0(a.bal)).join(" · ")}. Money set aside for VAT and Zakat isn't yours to spend.</p></div>
  ${life? `<div class="panel"><h2>Annual performance</h2><div class="tw"><table>${th(["Year","#Net revenue","#Growth","#Contribution","#Contrib %","#OpEx","#Net profit","#Net margin","#Orders","#Units","#Avg order","#Cash at year end"])}
  ${D.byYear.map((r,i)=>`<tr>${td(r.label)}${n0(r.rev)}${td(i&&D.byYear[i-1].rev? pct(r.rev/D.byYear[i-1].rev-1):"–","n")}${n0(r.con)}${np(r.conPct)}${n0(r.opxT)}${n0(r.np)}${np(r.npPct)}${ni(r.orders)}${ni(r.units)}${n0(r.aov)}${n0(r.close)}</tr>`).join("")}
  <tr class="tot">${td("LIFETIME")}${n0(t.rev)}${td("–","n")}${n0(t.con)}${np(t.conPct)}${n0(t.opxT)}${n0(t.np)}${np(t.npPct)}${ni(t.orders)}${ni(t.units)}${n0(t.aov)}${n0(t.close)}</tr></table></div></div>`:""}
  <div class="panel"><h2>Monthly performance</h2><div class="tw"><table>${th(["Month","#Target","#Net revenue","#vs target","#Contribution","#Contrib %","#OpEx","#Net profit","#Net margin","#Orders","#Avg order","#Cash at month end"])}
  ${D.pl.filter(r=>!life || r.rev || r.orders || r.opxT || r.key>=C.months[0].key).map(r=>`<tr>${td(r.label)}${n0(r.goal)}${n0(r.rev)}${td(r.goal? pct(r.rev/r.goal):"–","n "+(r.goal&&r.rev<r.goal?"neg":""))}${n0(r.con)}${np(r.conPct)}${n0(r.opxT)}${n0(r.np)}${np(r.npPct)}${ni(r.orders)}${n0(r.aov)}${n0(r.close)}</tr>`).join("")}
  <tr class="tot">${td("TOTAL")}${n0(t.goal)}${n0(t.rev)}${td(t.goal?pct(t.rev/t.goal):"–","n")}${n0(t.con)}${np(t.conPct)}${n0(t.opxT)}${n0(t.np)}${np(t.npPct)}${ni(t.orders)}${n0(t.aov)}${n0(t.close)}</tr></table></div></div>`; },

orders(){ const q = (S.q||"").toLowerCase(); const list = C.orders.filter(o=>!q || JSON.stringify(o).toLowerCase().includes(q));
  return `<div class="row"><h2 style="font-size:22px">Order tracker</h2><span class="grow"></span><input id="q" placeholder="Search customer, item, date…" value="${esc(S.q||"")}"> ${canW()?`<button class="btn" data-act="newOrder">+ New order</button>`:""}</div>
  <p class="sub">One row per order. Price, VAT, ingredient cost and contribution come from Menu & Pricing and Recipes; delivery is ${fmt0(C.DF)} SAR charged / ${fmt0(C.DC)} SAR cost unless marked pickup. Click a row to edit.</p>
  <div class="tw"><table>${th(["Date","Customer","Phone","Items","#Units","#Subtotal ex-VAT","#VAT","#Total","Paid into","#Ingredients","#Packaging","#Delivery cost","#Contribution","#Contrib %","Receipt",""])}
  ${list.length? list.map(o=>`<tr data-edit="orders:${o.id}" style="cursor:pointer">${td(esc(o.date))}${td(esc(o.customer||""))}${td(esc(o.phone||""))}${td(esc(o.items.map(i=>(N(i.qty)>1?i.qty+"× ":"")+i.label+(i.custom?" (custom)":"")).join(", ")))}${ni(o.units)}${n2(o.net)}${n2(o.vat)}${td("<b>"+fmt2(o.total)+"</b>","n")}${td(esc(o.account||"<span class='bad'>missing</span>"))}${n2(o.ing)}${n2(o.pkg)}${n2(o.delCost)}${td("<b>"+fmt2(o.con)+"</b>","n"+(o.con<0?" neg":""))}${np(o.conPct)}${td(`<button class="btn sec" style="padding:2px 8px" data-receipt="${o.id}" type="button" title="Receipt">🧾${o.receiptNo? " "+esc(o.receiptNo):""}</button>`)}${td(canW()?`<button class="x" data-del="orders:${o.id}" title="Delete">✕</button>`:"")}</tr>`).join("") : `<tr><td colspan="16" class="empty">No orders yet. Add your first order with the button above.</td></tr>`}
  <tr class="tot">${td("TOTALS")}${td(list.length+" orders")}${td("")}${td("")}${ni(list.reduce((a,o)=>a+o.units,0))}${n0(list.reduce((a,o)=>a+o.net,0))}${n0(list.reduce((a,o)=>a+o.vat,0))}${n0(list.reduce((a,o)=>a+o.total,0))}${td("")}${n0(list.reduce((a,o)=>a+o.ing,0))}${n0(list.reduce((a,o)=>a+o.pkg,0))}${n0(list.reduce((a,o)=>a+o.delCost,0))}${n0(list.reduce((a,o)=>a+o.con,0))}${td("")}${td("")}${td("")}</tr></table></div>`; },

expenses(){ const list = C.expenses;
  return `<div class="row"><h2 style="font-size:22px">Expenses & money log</h2><span class="grow"></span>${canW()?`<button class="btn" data-act="newExpense">+ New entry</button>`:""}</div>
  <p class="sub">Every payment that isn't a customer order. Amounts include VAT; the VAT and net split is worked out from the category. Click a row to edit, 📎 to see the bill.</p>
  <div class="tw"><table>${th(["Date","Supplier / party","Category","#Amount incl. VAT","#VAT","#Net of VAT","Paid from","Bill",""])}
  ${list.length? list.map(e=>`<tr data-edit="expenses:${e.id}" style="cursor:pointer${e.review?";background:color-mix(in srgb,var(--orange) 10%,transparent)":""}">${td(esc(e.date))}${td(esc(e.party||"")+(e.notes?`<div class="note" style="font-size:11px;max-width:320px;white-space:normal">${esc(e.notes)}</div>`:""))}${td(esc(e.cat||"<span class='bad'>missing</span>"))}${td((e.gross<0?"":"<span class='ok'>+</span>")+fmt2(Math.abs(e.gross)),"n")}${n2(Math.abs(e.vat))}${n2(Math.abs(e.net))}${td(esc(e.account||"<span class='bad'>missing</span>"))}${td(e.hasBill?`<button class="btn sec" style="padding:2px 8px" data-bill="${e.id}" type="button">📎</button>`:"–")}${td(canW()?`<button class="x" data-del="expenses:${e.id}">✕</button>`:"")}</tr>`).join("") : `<tr><td colspan="9" class="empty">Nothing logged yet.</td></tr>`}
  <tr class="tot">${td("TOTALS")}${td(list.length+" entries")}${td("")}${n0(list.reduce((a,e)=>a+N(e.out),0))}${n0(-list.reduce((a,e)=>a+(e.gross<0?e.vat:0),0))}${n0(-list.reduce((a,e)=>a+(e.gross<0?e.net:0),0))}${td("")}${td("")}${td("")}</tr></table></div><p class="note">Totals are money paid out. Entries marked + are money received (capital, loans, refunds).</p>`; },

daily(){ const mk = S.dailyM || C.months.find(m=>m.key===today().slice(0,7))?.key || C.months[0].key; const rows = C.daily.filter(d=>d.key.startsWith(mk)); const sum = k => rows.reduce((a,d)=>a+d[k],0);
  return `<div class="row"><h2 style="font-size:22px">Daily log</h2><select id="dailyM">${C.months.map(m=>`<option value="${m.key}" ${m.key===mk?"selected":""}>${m.label}</option>`).join("")}</select></div>
  <p class="sub">Every day of the month, from the orders you logged. Fixed costs = that month's operating expenses spread evenly across its days.</p>
  <div class="tw"><table>${th(["Date","Day","#Orders","#Units","#Loaves","#Net revenue","#Discounts","#Ingredients","#Packaging","#Delivery","#Contribution","#Contrib %","#Fixed (daily)","#Daily profit","#Month to date"])}
  ${rows.map(d=>`<tr style="${d.rev?"background:color-mix(in srgb,var(--sage) 35%,transparent)":""}">${td(d.key)}${td(d.dow)}${ni(d.orders)}${ni(d.units)}${ni(d.loaves)}${n0(d.rev)}${n0(d.disc)}${n0(d.ing)}${n0(d.pkg)}${n0(d.del)}${n0(d.con)}${np(d.conPct)}${n0(d.fixed)}${td("<b>"+fmt0(d.profit)+"</b>","n"+(d.profit<0?" neg":""))}${n0(d.mtd)}</tr>`).join("")}
  <tr class="tot">${td("MONTH")}${td("")}${ni(sum("orders"))}${ni(sum("units"))}${ni(sum("loaves"))}${n0(sum("rev"))}${n0(sum("disc"))}${n0(sum("ing"))}${n0(sum("pkg"))}${n0(sum("del"))}${n0(sum("con"))}${np(sum("rev")?sum("con")/sum("rev"):null)}${n0(sum("fixed"))}${n0(sum("profit"))}${td("")}</tr></table></div>`; },

monthly(){ const t=C.tot; return `<h2 style="font-size:22px">Monthly summary</h2><p class="sub">One row per month, from orders, expenses and goals.</p>
  <div class="tw"><table>${th(["Month","#Orders","#Units","#Loaves","#Net revenue","#Discounts","#Variable costs","#Contribution","#Contrib %","#Wastage & variance","#OpEx","#Net profit","#Net margin","#Avg order","#Best day","#Worst day","#Goal","#vs goal"])}
  ${C.pl.map(r=>{ const ds = C.daily.filter(d=>d.key.startsWith(r.key)&&d.rev>0).map(d=>d.rev); return `<tr>${td(r.label)}${ni(r.orders)}${ni(r.units)}${ni(r.loaves)}${n0(r.rev)}${n0(-r.disc)}${n0(r.vc)}${n0(r.con)}${np(r.conPct)}${n0(r.vari)}${n0(r.opxT)}${td("<b>"+fmt0(r.np)+"</b>","n"+(r.np<0?" neg":""))}${np(r.npPct)}${n0(r.aov)}${n0(ds.length?Math.max(...ds):0)}${n0(ds.length?Math.min(...ds):0)}${n0(r.goal)}${np(r.goal?r.rev/r.goal:null)}</tr>`; }).join("")}
  <tr class="tot">${td("YEAR")}${ni(t.orders)}${ni(t.units)}${ni(t.loaves)}${n0(t.rev)}${n0(-t.disc)}${n0(t.vc)}${n0(t.con)}${np(t.conPct)}${n0(t.vari)}${n0(t.opxT)}${n0(t.np)}${np(t.npPct)}${n0(t.aov)}${td("")}${td("")}${n0(t.goal)}${np(t.goal?t.rev/t.goal:null)}</tr></table></div>
  <div class="panel" style="margin-top:16px"><h2>Units sold by item</h2><div class="tw"><table>${monthHdr("Item")}${C.items.map(i=>`<tr>${td(esc(i.name))}${i.per.map(ni).join("")}${td("<b>"+int(i.units)+"</b>","n")}</tr>`).join("")}</table></div></div>`; },

yearly(){ const Y=C.years; const rows=[["Orders",y=>int(y.orders)],["Units sold",y=>int(y.units)],["Loaves sold",y=>int(y.loaves)],["Net revenue",y=>fmt0(y.rev),1],["Revenue growth",y=>pct(y.growth)],["Variable costs",y=>fmt0(y.vc)],["Contribution",y=>fmt0(y.con),1],["Contribution margin",y=>pct(y.conPct)],["Wastage & variance",y=>fmt0(y.vari)],["Operating expenses",y=>fmt0(y.opx)],["Net profit",y=>fmt0(y.np),1],["Net margin",y=>pct(y.npPct)],["Avg order value",y=>fmt0(y.aov)],["Avg monthly revenue",y=>fmt0(y.rev/12)]];
  const t=C.tot, top=[...C.items].sort((a,b)=>b.units-a.units)[0], best=[...C.pl].sort((a,b)=>b.rev-a.rev)[0];
  return `<h2 style="font-size:22px">Yearly overview</h2><p class="sub">This financial year's KPIs, then year on year.</p>
  <div class="cards">${[["Total orders",int(t.orders)],["Units sold",int(t.units)],["Net revenue",fmt0(t.rev)],["Contribution",fmt0(t.con)],["Contribution margin",pct(t.conPct)],["Net profit",fmt0(t.np)],["Net margin",pct(t.npPct)],["Avg order value",fmt0(t.aov)],["Avg monthly revenue",fmt0(t.rev/C.monthsActive)],["Best month",best&&best.rev?best.label:"–"],["Top selling item",top&&top.units?esc(top.name):"–"],["Wastage & variance",fmt0(t.vari)]].map(([l,v])=>`<div class="card"><div class="l">${l}</div><div class="v ${String(v).length>9?"small":""}">${v}</div></div>`).join("")}</div>
  <div class="tw"><table>${th(["Metric",...Y.map(y=>"#"+y.label)])}${rows.map(([l,f,b])=>`<tr class="${b?"tot":""}">${td(l)}${Y.map(y=>td(f(y),"n")).join("")}</tr>`).join("")}</table></div>`; },

items(){ return `<div class="row"><h2 style="font-size:22px">Item sales tracker</h2><span class="grow"></span>${canW()?`<button class="btn sec" data-act="addMenu">+ Add item</button>`:""}</div><p class="sub">Units per item per month (a box counts as one unit). Items are added and priced on the Menu &amp; Pricing tab — the button takes you there.</p>
  <div class="tw"><table>${th(["Range","Item","#Price ex-VAT",...C.months.map(m=>"#"+m.label),"#Total units","#Net sales","#Est. contribution","#Rank"])}
  ${C.items.map(i=>`<tr>${td(esc(i.range||""))}${td(esc(i.name))}${n2(i.priceEx)}${i.per.map(ni).join("")}${td("<b>"+int(i.units)+"</b>","n")}${n0(i.sales)}${n0(i.est)}${td(i.rank? (i.rank<=3?`<span class="pill ok">#${i.rank}</span>`:"#"+i.rank):"–","n")}</tr>`).join("")}
  <tr class="tot">${td("TOTALS")}${td("")}${td("")}${C.months.map((m,k)=>ni(C.items.reduce((a,i)=>a+i.per[k],0))).join("")}${ni(C.items.reduce((a,i)=>a+i.units,0))}${n0(C.items.reduce((a,i)=>a+i.sales,0))}${n0(C.items.reduce((a,i)=>a+i.est,0))}${td("")}</tr></table></div>`; },

pl(){ const t=C.tot; const opx = Object.keys(C.pl[0].opx);
  return `<h2 style="font-size:22px">P&L, cash flow & VAT</h2><p class="sub">Excluding VAT. Built from the orders, expenses and wastage you logged.</p>
  <div class="panel"><h2>Profit & loss</h2><div class="tw"><table>${monthHdr("Line item")}
  <tr class="sec">${td("Revenue")}${td("",`colspan="13"`)}</tr>${mrow("Focaccia sales",r=>r.foc)}${mrow("Pantry sales",r=>r.pan)}${mrow("Gathering box sales",r=>r.box)}${mrow("Other sales",r=>r.oth)}${mrow("Less: discounts",r=>r.disc)}${mrow("Net revenue",r=>r.rev,"tot")}
  <tr class="sec">${td("Variable costs (per recipe, for what you sold)")}${td("",`colspan="13"`)}</tr>${mrow("Ingredient costs",r=>r.ing)}${mrow("Packaging costs",r=>r.pkg)}${mrow("Total variable costs",r=>r.vc,"tot")}
  <tr class="sec">${td("Delivery (pass-through to the driver)")}${td("",`colspan="13"`)}</tr>${mrow("Delivery fees collected",r=>r.fee)}${mrow("Paid to driver",r=>-r.del)}${mrow("Delivery net",r=>r.delNet,"tot")}${mrow("CONTRIBUTION",r=>r.con,"key")}${mrow("Contribution margin %",r=>r.conPct,"",np,t=>t.conPct)}
  <tr class="sec">${td("Wastage & purchase variance")}${td("",`colspan="13"`)}</tr>${mrow("Ingredients actually bought",r=>r.ingB)}${mrow("Packaging actually bought",r=>r.pkgB)}${mrow("Variance: bought − used per recipe",r=>r.vari,"tot")}${mrow("memo: wastage logged",r=>r.waste)}${mrow("GROSS PROFIT",r=>r.gp,"key")}${mrow("Gross margin %",r=>r.gpPct,"",np,t=>t.gpPct)}
  <tr class="sec">${td("Operating expenses")}${td("",`colspan="13"`)}</tr>${opx.map(k=>mrow(esc(k),r=>r.opx[k])).join("")}${mrow("Total OpEx",r=>r.opxT,"tot")}${mrow("NET PROFIT",r=>r.np,"key")}${mrow("Net margin %",r=>r.npPct,"",np,t=>t.npPct)}
  </table></div><p class="note">Positive variance = waste, over-portioning, or stock bought ahead. Labour and overhead are not inside recipe costs; log what you pay in Expenses.</p></div>
  <div class="panel"><h2>Cash flow (VAT included, real money)</h2><div class="tw"><table>${monthHdr("")}${mrow("Opening cash",r=>r.open,"tot",n0,t=>t.open)}${mrow("Cash received from customers",r=>r.cashIn)}${mrow("Delivery costs paid",r=>r.cashDel)}${mrow("Purchases & bills paid",r=>r.cashBills)}${mrow("VAT paid to ZATCA",r=>r.cashVat)}${mrow("Equipment bought",r=>r.cashEq)}${mrow("Owner in / (out), loans & transfers",r=>r.cashFin)}${mrow("Net cash flow",r=>r.ncf,"tot")}${mrow("CLOSING CASH",r=>r.close,"key",n0,t=>t.close)}</table></div></div>
  <div class="panel"><h2>VAT summary (monthly)</h2><div class="tw"><table>${monthHdr("")}${mrow("VAT charged to customers",r=>r.vatOut)}${mrow("VAT paid on purchases",r=>r.vatIn)}${mrow("NET VAT PAYABLE",r=>r.vatNet,"key")}</table></div></div>`; },

bs(){ const asAt = S.bsDate || (C.fyEndKey+"-"+new Date(Date.UTC(parseInt(C.fyEndKey.slice(0,4)),parseInt(C.fyEndKey.slice(5,7)),0)).getUTCDate()); const b=C.bs(asAt);
  const r = (l,v,k="") => `<tr class="${k}">${td(l)}${n2(v)}</tr>`;
  return `<div class="row"><h2 style="font-size:22px">Balance sheet</h2><label>As at <input type="date" id="bsDate" value="${asAt}"></label></div><p class="sub">What the business owns and owes on that date.</p>
  <div class="panel" style="max-width:640px"><div class="tw"><table><tr class="sec"><td colspan="2">Assets</td></tr>${b.accts.map(a=>r(esc(a.name),a.bal)).join("")}${r("Owed by customers (unpaid / partial)",b.recv)}${r("Equipment (at cost)",b.equip)}${r("Transfers in transit (should be zero)",b.transit)}${r("TOTAL ASSETS",b.ta,"tot")}
  <tr class="sec"><td colspan="2">Liabilities</td></tr>${r("VAT owed to / (due from) ZATCA",b.vatL)}${r("Loans outstanding",b.loans)}${r("TOTAL LIABILITIES",b.tl,"tot")}
  <tr class="sec"><td colspan="2">Owner's equity</td></tr>${r("Opening balances",b.opening)}${r("Capital put in (incl. costs paid personally)",b.cap)}${r("Drawings taken",b.draw)}${r("Accumulated profit / (loss)",b.acc)}${r("TOTAL EQUITY",b.te,"tot")}${r("TOTAL LIABILITIES & EQUITY",b.tle,"key")}
  <tr><td>Check</td><td class="n ${b.check===0?"ok":"bad"}"><b>${b.check===0?"✓ Balanced":"⚠ Out of balance "+fmt2(b.check)}</b></td></tr></table></div><p class="note">If it's out of balance, an order is missing its "paid into" account or an expense is missing a category or account.</p></div>`; },

vat(){ const qs=[0,1,2,3].map(q=>{ const ms=C.pl.slice(q*3,q*3+3); const o={label:"Q"+(q+1),start:ms[0].key,end:ms[2].key, sales:ms.reduce((a,r)=>a+r.rev,0), out:ms.reduce((a,r)=>a+r.vatOut,0), inn:ms.reduce((a,r)=>a+r.vatIn,0)}; o.net=o.out-o.inn; o.paid=-C.expenses.filter(e=>e.type==="VAT"&&e.m>=o.start&&e.m<=o.end).reduce((a,e)=>a+e.net,0); return o; });
  let cf=0; qs.forEach(q=>{ cf+=q.net-q.paid; q.cf=cf; });
  const due = q => { const [y,m]=q.end.split("-").map(Number); const d=new Date(Date.UTC(y,m+1,0)); return d.toISOString().slice(0,10); };
  const row=(l,f,k="")=>`<tr class="${k}">${td(l)}${qs.map(q=>n2(f(q))).join("")}${n2(qs.reduce((a,q)=>a+f(q),0))}</tr>`;
  return `<h2 style="font-size:22px">VAT return helper</h2><p class="sub">Quarterly figures for ZATCA. Assumes quarterly filing, due the last day of the month after each quarter. Confirm with your accountant.</p>
  <div class="panel" style="max-width:820px"><div class="tw"><table>${th(["","#Q1","#Q2","#Q3","#Q4","#Full year"])}<tr>${td("Period")}${qs.map(q=>td(q.start+" → "+q.end,"n")).join("")}${td("")}</tr><tr>${td("File & pay by")}${qs.map(q=>td(due(q),"n")).join("")}${td("")}</tr>
  ${row("Sales (excl. VAT)",q=>q.sales)}${row("Output VAT charged",q=>q.out)}${row("Input VAT reclaimable",q=>q.inn)}${row("NET VAT DUE / (REFUNDABLE)",q=>q.net,"key")}${row("Paid to / (refunded by) ZATCA",q=>q.paid)}<tr class="tot">${td("Unpaid VAT carried forward")}${qs.map(q=>n2(q.cf)).join("")}${n2(cf)}</tr></table></div></div>`; },

zakat(){ const Z = C.zakat, ZK = C.st.zakat; const r = (l,v,k="",extra="") => `<tr class="${k}">${td(l+(extra?` <span class="note">${extra}</span>`:""))}${n2(v)}</tr>`;
  const ed = (l, key, hint) => `<tr>${td(l+(hint?` <span class="note">${hint}</span>`:""))}${td(canW()? inp("settings.zakat."+key, ZK[key]??"", "number") : fmt2(N(ZK[key])), "n")}</tr>`;
  const badge = d => d.done ? `<span class="pill ok">✓ ${d.what==="VAT return"||d.what==="Zakat return" ? "Filed" : "Done"}${d.ref?" · "+esc(d.ref):""}</span>` : d.days<0 ? `<span class="pill bad">Overdue ${-d.days} d</span>` : d.days<=14 ? `<span class="pill warn">${d.days} days left</span>` : `<span class="pill">${d.days} days left</span>`;
  const typeList = ["Zakat return","Zakat payment","Zakat certificate","VAT return","VAT payment","Licence / registration","Other ZATCA"];
  return `<div class="row"><h2 style="font-size:22px">Zakat & ZATCA</h2><span class="grow"></span>${canW()?`<button class="btn" data-act="newFiling">+ Log filing / payment</button>`:""}</div>
  <p class="sub">Zakat worked out from your own books, plus a log of every return, payment, certificate and licence with its paperwork attached. Blue cells are yours to edit.</p>
  <div class="grid2" style="align-items:start"><div class="panel"><h2>Zakat calculation</h2>
    <div class="row" style="margin-bottom:8px;gap:12px"><label>As at ${canW()?`<input type="date" class="in" data-k="settings.zakat.asAt" value="${esc(Z.asAt)}">`:esc(Z.asAt)}</label><label>Year basis ${canW()?`<select class="in" data-k="settings.zakat.basis"><option value="hijri" ${ZK.basis!=="gregorian"?"selected":""}>Hijri year — 2.5%</option><option value="gregorian" ${ZK.basis==="gregorian"?"selected":""}>Gregorian year — 2.5776%</option></select>`:(ZK.basis==="gregorian"?"Gregorian":"Hijri")}</label></div>
    ${Z.hijri?`<p class="note" style="margin:0 0 8px">${esc(Z.asAt)} = ${esc(Z.hijri)}</p>`:""}
    <div class="tw"><table><tr class="sec"><td colspan="2">Zakatable assets</td></tr>${Z.accts.map(a=>r(esc(a.name), Math.max(0,a.bal))).join("")}${r("Owed by customers", Z.recv)}${ed("Stock on hand at cost","stock","ingredients, packaging, finished goods")}${ed("Other zakatable assets","otherAssets","e.g. business savings elsewhere")}${r("Total zakatable assets", Z.assets, "tot")}
    <tr class="sec"><td colspan="2">Less: amounts due within the year</td></tr>${r("VAT owed to ZATCA", Z.vatL)}${r("Loans outstanding", Z.loans)}${ed("Other payables","otherLiab","suppliers, rent due, etc.")}${r("Total deductions", Z.liab, "tot")}
    <tr class="sec"><td colspan="2">Zakat</td></tr>${r("Zakat base", Z.base, "key")}${ed("Nisab (SAR)","nisab","value of 85 g gold; leave 0 to ignore")}${r("Rate", Z.rate*100, "", "%")}${r("Zakat due for the year", Z.due, "tot")}${r("Zakat already paid ("+Z.asAt.slice(0,4)+")", Z.paid)}<tr class="key"><td>Still to pay</td><td class="n ${Z.remaining>0?"warn":"ok"}"><b>${fmt2(Z.remaining)}</b></td></tr></table></div>
    <p class="note">Cash, receivables, VAT and loans come straight from the Balance Sheet as at that date. Enter stock and anything the books don't hold. ${Z.nisab && Z.base<Z.nisab?"<b>Base is below the nisab, so no Zakat is due.</b>":""} This is a working estimate for a sole trader; what ZATCA assesses on a filed return can differ.</p></div>
  <div class="panel"><h2>Deadlines</h2><div class="tw"><table>${th(["What","Period","Due","Status"])}${C.deadlines.length? C.deadlines.map(d=>`<tr ${d.logged?`data-edit="filings:${d.id}" style="cursor:pointer"`:""}>${td(esc(d.what))}${td(esc(d.period))}${td(d.due)}${td(badge(d))}</tr>`).join("") : `<tr><td colspan="4" class="note">Nothing upcoming.</td></tr>`}</table></div>
    <p class="note">VAT returns: quarterly, due by the end of the month after the quarter. Zakat return: within 120 days of the financial year end (${C.fyEndKey} month end). A deadline shows as filed once a filing of that type and period is logged below with a status other than Due. Check ZATCA's portal for your exact filing frequency.</p></div></div>
  <div class="panel" style="margin-top:16px"><h2>Filings, payments & certificates</h2><div class="tw"><table>${th(["Date","Type","Period","#Amount","Reference / certificate no.","Status","Due","Notes","Doc"])}
  ${C.filings.length? C.filings.map(f=>`<tr data-edit="filings:${f.id}" style="cursor:pointer">${td(esc(f.date||""))}${td(esc(f.type||""))}${td(esc(f.period||""))}${n2(N(f.amount))}${td(esc(f.ref||""))}${td(f.status==="Due"?`<span class="pill warn">Due</span>`:`<span class="pill ok">${esc(f.status||"")}</span>`)}${td(esc(f.due||""))}${td(esc(f.notes||""))}${td(f.hasBill?`<button class="x" data-bill="${f.id}" title="View document">📎</button>`:"")}</tr>`).join("") : `<tr><td colspan="9" class="note">Nothing logged yet. Use “+ Log filing / payment” for Zakat returns, Zakat payments, certificates, VAT returns and licence renewals — attach a photo of the paperwork to each.</td></tr>`}</table></div>
  <p class="note">Types: ${typeList.join(" · ")}. A Zakat or VAT payment can also be written to the Expenses log as money out, so your cash and balance sheet stay right (Zakat is treated as owner's drawings, not a business cost).</p></div>`; },
customers(){ const list = C.custs; return `<div class="row"><h2 style="font-size:22px">Customers</h2><span class="grow"></span>${canW()?`<button class="btn" data-act="newCustomer">+ Add customer</button>`:""}</div>
  <p class="sub">Add each customer once with the same name you use on orders; their history fills in. Orange = 45+ days since their last order, worth a WhatsApp check-in.</p>
  <div class="tw"><table>${th(["Customer","Phone","Area","First order","Last order","#Days since","#Orders","#Spent incl. VAT","#Avg order","Favourite item","Occasion","Tags",""])}
  ${list.length? list.map(c=>`<tr data-edit="customers:${c.id}" style="cursor:pointer">${td("<b>"+esc(c.name)+"</b>")}${td(esc(c.phone||""))}${td(esc(c.area||""))}${td(c.first)}${td(c.last)}${td(c.days==null?"–":`<span class="${c.days>45?"warn":""}">${c.days}</span>`,"n")}${ni(c.n)}${n0(c.spent)}${n0(c.aov)}${td(esc(c.fav))}${td(esc(c.occasion||""))}${td(esc(c.tags||""))}${td(canW()?`<button class="x" data-del="customers:${c.id}">✕</button>`:"")}</tr>`).join("") : `<tr><td colspan="13" class="empty">No customers yet.</td></tr>`}</table></div>`; },

menu(){ const t=C.tot; const fixedAvg = t.opxT/C.monthsActive; const cm = t.rev? t.conPct : (C.menuList.length? C.menuList.reduce((a,m)=>a+(m.margin||0),0)/C.menuList.length:0); const be = cm>0? fixedAvg/cm:null; const perDay = be? be/N(C.st.sellingDays):null; const aov = t.aov;
  return `<div class="row"><h2 style="font-size:22px">Menu, pricing & break-even</h2><span class="grow"></span>${canW()?`<button class="btn sec" data-act="addMenu">+ Add item</button>`:""}</div><p class="sub">Menu prices feed the orders. Costs come from Recipes and Boxes. Blue cells are yours to edit.</p>
  <div class="tw"><table>${th(["Range","Group","Item","#Menu price","#Price ex-VAT","#Price incl. VAT","#Ingredient / contents","#Packaging","#Total cost","#Contribution","#Margin","#Food cost %","Status","#Units (FY)",""])}
  ${C.menuList.map((m,i)=>`<tr>${td(canW()?inp(`menu.${i}.range`,m.range):esc(m.range||""))}${td(canW()?sel(`menu.${i}.group`,m.group,["Focaccia","Pantry","Gathering Box","Other"]):esc(m.group))}${td(canW()?inp(`menu.${i}.name`,m.name):esc(m.name))}${td(canW()?inp(`menu.${i}.price`,m.price,"number"):fmt2(m.price),"n")}${n2(m.priceEx)}${n2(m.priceInc)}${n2(m.cost)}${n2(m.pkg)}${n2(m.tuc)}${td("<b>"+fmt2(m.con)+"</b>","n"+(m.con<0?" neg":""))}${np(m.margin)}${np(m.foodPct)}${td(statusPill(m.status))}${ni(C.items[i]?.units)}${td(canW()?`<button class="x" data-rm="menu:${i}">✕</button>`:"")}</tr>`).join("")}</table></div>
  <div class="panel" style="margin-top:16px;max-width:640px"><h2>Break-even</h2><div class="kv"><span>Contribution margin used</span><b>${pct(cm)}</b><span>Avg monthly operating expenses (actual)</span><b>${fmt0(fixedAvg)}</b><span>Break-even revenue / month (ex-VAT)</span><b>${be?fmt0(be):"n/a"}</b><span>Break-even revenue / selling day</span><b>${perDay?fmt0(perDay):"n/a"}</b><span>Orders / day needed at your avg order value</span><b>${perDay&&aov? (perDay/aov).toFixed(1):"n/a"}</b><span>Avg monthly revenue so far</span><b>${fmt0(t.rev/C.monthsActive)}</b><span>Above / (below) break-even</span><b class="${be&&t.rev/C.monthsActive<be?"bad":"ok"}">${be?fmt0(t.rev/C.monthsActive-be):"n/a"}</b></div><p class="note">Changing a price re-prices past orders. To keep history, add the item again with the new price and a new name.</p></div>`; },

recipes(){ return `<div class="row"><h2 style="font-size:22px">Per-item recipe cost</h2><span class="grow"></span>${canW()?`<button class="btn sec" data-act="addRecipe">+ New recipe</button>`:""}</div><p class="sub">Quantity per batch in the ingredient's unit (kg, litre). Portions per batch splits the batch cost into a per-unit cost.</p>
  ${S.recipes.map((r,ri)=>{ const rc=C.rec[r.name]||{}; const m=C.menu[r.name]; return `<div class="block"><div class="hd"><h3>▸ ${esc(r.name||"New item")}</h3>${m?`<span>${esc(m.range||"")}</span>`:`<span class="note" style="color:#fff;opacity:.8">not on the menu</span>`}<span class="grow"></span>${canW()?`<button class="x" style="color:#fff" data-rm-recipe="${ri}">✕</button>`:""}</div><div class="bd">
    <div class="row" style="margin-bottom:8px"><label>Item name ${canW()?inp(`recipes.${ri}.name`,r.name):esc(r.name)}</label><label>Portions / batch ${canW()?inp(`recipes.${ri}.portions`,r.portions,"number",'style="width:80px"'):r.portions}</label><label>Packaging / unit (SAR) ${canW()?inp(`recipes.${ri}.packaging`,r.packaging,"number",'style="width:90px"'):fmt2(r.packaging)}</label></div>
    <div class="tw"><table>${th(["Ingredient","Unit","#Qty / batch","#Cost / unit","#Line cost","#% of batch","Notes",""])}

    <tr class="tot">${td("Batch ingredient cost")}${td("")}${td("")}${td("")}${n2(rc.batch)}${td("")}${td("")}${td(canW()?`<button class="btn sec" style="padding:3px 8px" data-add-line="${ri}">+ line</button>`:"")}</tr></table></div>

boxes(){ return `<div class="row"><h2 style="font-size:22px">Gathering boxes</h2><span class="grow"></span>${canW()?`<button class="btn sec" data-act="addBox">+ New box</button>`:""}</div><p class="sub">Item costs include each item's own packaging (from Recipes). Add utensils and the box itself.</p>

    <div class="tw"><table>${th(["Item","#Qty","#Unit cost","#Item total",""])}${(b.items||[]).map((it,ii)=>{ const uc=(C.rec[it.item]||{}).tuc||0; return `<tr>${td(canW()?sel(`boxes.${bi}.items.${ii}.item`,it.item,C.menuList.filter(x=>x.group!=="Gathering Box").map(x=>x.name)):esc(it.item))}${td(canW()?inp(`boxes.${bi}.items.${ii}.qty`,it.qty,"number"):it.qty,"n")}${n2(uc)}${n2(uc*N(it.qty))}${td(canW()?`<button class="x" data-rm-box-item="${bi}:${ii}">✕</button>`:"")}</tr>`; }).join("")}
    <tr>${td("Items cost subtotal")}${td("")}${td("")}${n2((bx.contents||0)-N(b.manual))}${td(canW()?`<button class="btn sec" style="padding:3px 8px" data-add-box-item="${bi}">+ item</button>`:"")}</tr>
    <tr>${td("Other contents / manual cost")}${td("")}${td("")}${td(canW()?inp(`boxes.${bi}.manual`,b.manual,"number"):fmt2(b.manual),"n")}${td("")}</tr><tr>${td("Utensils (plates / spoons / tissue / picks)")}${td("")}${td("")}${td(canW()?inp(`boxes.${bi}.utensils`,b.utensils,"number"):fmt2(b.utensils),"n")}${td("")}</tr><tr>${td("Box packaging")}${td("")}${td("")}${td(canW()?inp(`boxes.${bi}.box`,b.box,"number"):fmt2(b.box),"n")}${td("")}</tr>
    <tr class="tot">${td("TOTAL BOX COST")}${td("")}${td("")}${n2(bx.total)}${td("")}</tr><tr>${td("Sale price ex-VAT (from Menu)")}${td("")}${td("")}${n2(m?m.priceEx:0)}${td("")}</tr><tr class="key">${td("Contribution / box")}${td("")}${td("")}${n2(m?m.priceEx-bx.total:null)}${td(m?pct((m.priceEx-bx.total)/m.priceEx):"")}</tr></table></div></div></div>`; }).join("")}`; },

ingredients(){ return `<div class="row"><h2 style="font-size:22px">Ingredient master list</h2><span class="grow"></span>${canW()?`<button class="btn sec" data-act="addIng">+ Add ingredient</button>`:""}</div><p class="sub">Update a price here and every recipe, box, menu margin and order updates. If you reclaim VAT, enter prices before VAT.</p>
  <div class="tw"><table>${th(["Ingredient","Category","Purchase unit","#Pack size","Unit of measure","#Purchase price","#Cost / unit","Supplier / notes",""])}
  ${S.ingredients.map((i,k)=>`<tr>${td(canW()?inp(`ingredients.${k}.name`,i.name):esc(i.name))}${td(canW()?inp(`ingredients.${k}.cat`,i.cat):esc(i.cat||""))}${td(canW()?sel(`ingredients.${k}.unit`,i.unit,["kg","g","litre","ml","unit","pack"]):esc(i.unit))}${td(canW()?inp(`ingredients.${k}.pack`,i.pack,"number"):i.pack,"n")}${td(canW()?sel(`ingredients.${k}.uom`,i.uom,["kg","litre","unit"]):esc(i.uom))}${td(canW()?inp(`ingredients.${k}.price`,i.price,"number"):fmt2(i.price),"n")}${td("<b>"+fmt2(C.ingCost[i.name])+"</b>","n")}${td(canW()?inp(`ingredients.${k}.supplier`,i.supplier):esc(i.supplier||""))}${td(canW()?`<button class="x" data-rm="ingredients:${k}">✕</button>`:"")}</tr>`).join("")}</table></div>`; },

batch(){ const plan = S.plan || {}; const names = C.menuList.map(m=>m.name); const week = n => (plan[n]||[]).reduce((a,b)=>a+N(b),0);
  const toMake = {}; names.forEach(n=>{ if(C.box[n]) return; let q = week(n); S.boxes.forEach(b=>{ q += week(b.name)*(b.items||[]).filter(it=>it.item===n).reduce((a,it)=>a+N(it.qty),0); }); toMake[n]=q; });
  const batches = {}; S.recipes.forEach(r=>{ batches[r.name] = N(r.portions)? Math.ceil((toMake[r.name]||0)/N(r.portions)) : 0; });
  const need = {}; S.recipes.forEach(r=>(r.lines||[]).forEach(l=>{ need[l.ing]=(need[l.ing]||0)+N(l.qty)*(batches[r.name]||0); }));
  const stock = S.stock||{};
  return `<h2 style="font-size:22px">Batch planner & shopping list</h2><p class="sub">Plan the week's sales (boxes too). Box contents are exploded into items, rounded up to whole batches, then turned into a shopping list. Plans are kept in this browser only.</p>
  <div class="grid2"><div class="panel"><h2>Step 1 · planned quantities</h2><div class="tw"><table>${th(["Item","Mon","Tue","Wed","Thu","Fri","Sat","Sun","#Week","#To make","#Batches"])}
  ${names.map(n=>`<tr>${td(esc(n))}${[0,1,2,3,4,5,6].map(d=>td(`<input type="number" min="0" data-plan="${esc(n)}:${d}" value="${(plan[n]||[])[d]||""}" style="width:52px">`)).join("")}${ni(week(n))}${td(C.box[n]?"–":int(toMake[n]),"n")}${td(C.box[n]?"–":(batches[n]!=null?int(batches[n]):"–"),"n")}</tr>`).join("")}</table></div></div>
  <div class="panel"><h2>Step 2 · shopping list</h2><div class="tw"><table>${th(["Ingredient","#Qty needed","Unit","#Cost / unit","#Est. cost","#In stock","#To buy","#Spend","Supplier"])}
  ${S.ingredients.filter(i=>need[i.name]>0).map(i=>{ const q=need[i.name], c=C.ingCost[i.name], buy=Math.max(0,q-N(stock[i.name])); return `<tr style="${buy>0?"background:color-mix(in srgb,var(--orange) 12%,transparent)":""}">${td(esc(i.name))}${td(q.toFixed(3),"n")}${td(esc(i.uom))}${n2(c)}${n2(q*c)}${td(`<input type="number" min="0" step="any" data-stock="${esc(i.name)}" value="${stock[i.name]||""}" style="width:70px">`,"n")}${td(buy.toFixed(3),"n")}${n2(buy*c)}${td(esc(i.supplier||""))}</tr>`; }).join("")||`<tr><td colspan="9" class="empty">Enter planned quantities to build the list.</td></tr>`}
  <tr class="tot">${td("TOTAL")}${td("")}${td("")}${td("")}${n0(Object.entries(need).reduce((a,[k,q])=>a+q*(C.ingCost[k]||0),0))}${td("")}${td("")}${n0(Object.entries(need).reduce((a,[k,q])=>a+Math.max(0,q-N(stock[k]))*(C.ingCost[k]||0),0))}${td("")}</tr></table></div></div></div>`; },

goals(){ const t=C.tot; const a = S.scen || {orders:5, aov:55, vc:22, fixed:1700, days:N(C.st.sellingDays), p:0, v:0, c:0}; const sellDays = Math.max(1, C.daily.filter(d=>d.orders>0).length);
  const act = {orders:(t.orders/sellDays), aov:t.aov||0, vc:t.orders? t.vc/t.orders:0, fixed:t.opxT/C.monthsActive, days:N(C.st.sellingDays)};
  const sc = [["Current",1,1,1],["Price up 10%",1,1.1,1],["Price down 10%",1,.9,1],["Volume +30%",1.3,1,1],["Volume −20%",.8,1,1],["Costs up 15%",1,1,1.15],["Your scenario",1+N(a.v)/100,1+N(a.p)/100,1+N(a.c)/100]].map(([l,vm,pm,cm])=>{ const o=N(a.orders)*vm, av=N(a.aov)*pm, vc=N(a.vc)*cm, rev=o*av*N(a.days), vcs=o*vc*N(a.days), fx=N(a.fixed)*cm; return {l,o,av,vc,rev,vcs,fx,np:rev-vcs-fx}; });
  return `<h2 style="font-size:22px">Goals & what-if scenarios</h2><p class="sub">Set monthly goals (saved for everyone). Scenario assumptions are kept in this browser.</p>
  <div class="panel"><h2>Monthly goals vs actuals</h2><div class="tw"><table>${th(["Month","#Revenue goal (ex-VAT)","#Actual net revenue","#Gap","#% achieved","#Orders needed","#Actual orders","#Profit goal","#Actual net profit","#Gap"])}
  ${C.pl.map(r=>`<tr>${td(r.label)}${td(canW()?`<input class="in" type="number" data-goal="${r.key}:rev" value="${r.goal||""}" style="width:100px">`:fmt0(r.goal),"n")}${n0(r.rev)}${n0(r.goal?r.rev-r.goal:null)}${td(r.goal?`<b class="${r.rev>=r.goal?"ok":"bad"}">${pct(r.rev/r.goal)}</b>`:"–","n")}${td(r.goal&&t.aov?int(Math.ceil(r.goal/t.aov)):"–","n")}${ni(r.orders)}${td(canW()?`<input class="in" type="number" data-goal="${r.key}:profit" value="${r.goalP||""}" style="width:100px">`:fmt0(r.goalP),"n")}${n0(r.np)}${n0(r.goalP?r.np-r.goalP:null)}</tr>`).join("")}
  <tr class="tot">${td("YEAR")}${n0(t.goal)}${n0(t.rev)}${n0(t.goal?t.rev-t.goal:null)}${np(t.goal?t.rev/t.goal:null)}${td("")}${ni(t.orders)}${n0(t.goalP)}${n0(t.np)}${n0(t.goalP?t.np-t.goalP:null)}</tr></table></div></div>
  <div class="grid2"><div class="panel"><h2>Assumptions</h2><div class="tw"><table>${th(["","Your assumption","#Actual so far"])}${[["orders","Avg orders per selling day",act.orders.toFixed(1)],["aov","Avg order value ex-VAT (SAR)",fmt2(act.aov)],["vc","Avg variable cost per order (SAR)",fmt2(act.vc)],["fixed","Monthly fixed costs (SAR)",fmt0(act.fixed)],["days","Selling days per month",act.days],["p","Price change %","—"],["v","Volume change %","—"],["c","Cost change %","—"]].map(([k,l,v])=>`<tr>${td(l)}${td(`<input class="in" type="number" step="any" data-scen="${k}" value="${a[k]??""}" style="width:100px">`)}${td(v,"n")}</tr>`).join("")}</table></div><p class="note"><button class="btn sec" data-act="useActual">Use my actual figures</button></p></div>
  <div class="panel"><h2>Scenario results (per month)</h2><div class="tw"><table>${th(["Scenario","#Orders / day","#Avg order","#Var cost / order","#Revenue","#Variable costs","#Fixed","#Profit","#Margin","#vs current"])}${sc.map((s,i)=>`<tr class="${i===6?"tot":""}">${td(s.l)}${td(s.o.toFixed(1),"n")}${n2(s.av)}${n2(s.vc)}${n0(s.rev)}${n0(s.vcs)}${n0(s.fx)}${td("<b>"+fmt0(s.np)+"</b>","n"+(s.np<0?" neg":""))}${np(s.rev?s.np/s.rev:null)}${td(i?`<span class="${s.np-sc[0].np<0?"bad":"ok"}">${fmt0(s.np-sc[0].np)}</span>`:"—","n")}</tr>`).join("")}</table></div></div></div>`; },

wastage(){ const cap = S.cap || {loaves:10, items:20}; const dows=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]; const avgL = (()=>{ const f=C.menuList.filter(m=>m.group==="Focaccia"); return f.length? f.reduce((a,m)=>a+m.priceEx,0)/f.length:0; })();
  const prev = C.wastage.filter(w=>w.preventable==="Yes").reduce((a,w)=>a+w.cost,0);
  return `<div class="row"><h2 style="font-size:22px">Wastage & kitchen capacity</h2><span class="grow"></span>${canW()?`<button class="btn" data-act="newWaste">+ Log wastage</button>`:""}</div><p class="sub">Log anything thrown away. Capacity uses your average sales per weekday.</p>
  <div class="grid2"><div class="panel"><h2>Kitchen capacity (per day)</h2><div class="row" style="margin-bottom:8px"><label>Max loaves / day <input type="number" data-cap="loaves" value="${cap.loaves}" style="width:70px"></label><label>Max pantry items / day <input type="number" data-cap="items" value="${cap.items}" style="width:70px"></label></div>
  <div class="tw"><table>${th(["Day","#Avg loaves sold","#Avg units sold","#Capacity used","#Spare loaves","#Unused revenue (SAR)","#Days counted"])}${dows.map(d=>{ const ds=C.daily.filter(x=>x.dow===d&&x.orders>0); const al=ds.length?ds.reduce((a,x)=>a+x.loaves,0)/ds.length:0, au=ds.length?ds.reduce((a,x)=>a+x.units,0)/ds.length:0; const used=N(cap.loaves)?al/N(cap.loaves):null; return `<tr>${td(d)}${td(al.toFixed(1),"n")}${td(au.toFixed(1),"n")}${td(`<b class="${used>.9?"bad":""}">${pct(used)}</b>`,"n")}${td(Math.max(0,N(cap.loaves)-al).toFixed(1),"n")}${n0(Math.max(0,N(cap.loaves)-al)*avgL)}${ni(ds.length)}</tr>`; }).join("")}</table></div><p class="note">Above 90% used means you're near capacity; consider a second bake slot, pre-orders or higher peak-day prices.</p></div>
  <div class="panel"><h2>Wastage log</h2><div class="cards"><div class="card"><div class="l">Total waste cost</div><div class="v">${fmt0(C.wastage.reduce((a,w)=>a+w.cost,0))}</div></div><div class="card"><div class="l">Preventable</div><div class="v">${fmt0(prev)}</div></div></div>
  <div class="tw"><table>${th(["Date","Type","Item","#Qty","#Cost / unit","#Waste cost","Reason","Preventable",""])}${C.wastage.length?C.wastage.map(w=>`<tr data-edit="wastage:${w.id}" style="cursor:pointer">${td(w.date)}${td(esc(w.type))}${td(esc(w.item))}${td(w.qty,"n")}${n2(w.cpu)}${n2(w.cost)}${td(esc(w.reason||""))}${td(esc(w.preventable||""))}${td(canW()?`<button class="x" data-del="wastage:${w.id}">✕</button>`:"")}</tr>`).join(""):`<tr><td colspan="9" class="empty">Nothing logged.</td></tr>`}</table></div></div></div>`; },

settings(){ const s=S.settings; return `<h2 style="font-size:22px">Settings</h2><p class="sub">Set once. Every view reads from here.</p>
  <div class="grid2"><div class="panel"><h2>Business & VAT</h2><div class="form"><label>Business name ${inp("settings.business",s.business)}</label><label>Financial year start ${inp("settings.fyStart",s.fyStart,"date")}</label><label>VAT registered with ZATCA? ${sel("settings.vatRegistered",s.vatRegistered?"Yes":"No",["Yes","No"])}</label><label>VAT rate (%) ${inp("settings.vatRate",Math.round(N(s.vatRate)*1000)/10,"number")}</label><label>VAT applies from (registration date; blank = always) ${inp("settings.vatFrom",s.vatFrom||"","date")}</label><label>Menu prices include VAT? ${sel("settings.pricesInclVat",s.pricesInclVat?"Yes":"No",["Yes","No"])}</label><label>Target contribution margin (%) ${inp("settings.targetMargin",Math.round(N(s.targetMargin)*1000)/10,"number")}</label><label>Selling days per month ${inp("settings.sellingDays",s.sellingDays,"number")}</label><label>Delivery charged to customer (SAR) ${inp("settings.deliveryFee",s.deliveryFee==null?40:s.deliveryFee,"number")}</label><label>Delivery cost you pay (SAR) ${inp("settings.deliveryCost",s.deliveryCost==null?40:s.deliveryCost,"number")}</label></div></div>
  <div class="panel"><h2>Receipts</h2><div class="form">${(()=>{ const rc = rcfg(); const I=(k,l,t="text",w=false)=>`<label class="${w?"wide":""}">${l} ${inp("settings.receipt."+k, rc[k], t)}</label>`; return I("business","Business name on receipt")+I("tagline","Tagline")+I("employee","Employee line")+I("pos","POS line")+I("handle","Footer handle")+I("phone","Phone (optional)")+I("address","Address (optional)")+I("vatNo","VAT number (blank if not registered)")+I("footer","Extra footer line")+I("prefix","Receipt number prefix")+I("nextNo","Next receipt number","number")+I("publicUrl","Public link of this page (for customer links)","url",true); })()}</div><p class="note">Delivery is charged outside VAT on receipts and in the accounts. With a VAT number set, receipts carry a ZATCA phase-1 QR code. Customer links need this page shared as "Anyone with the link".</p></div>
  <div class="panel"><h2>Money accounts & opening balances</h2><div class="tw"><table>${th(["Account","#Opening balance (SAR)",""])}${(s.accounts||[]).map((a,i)=>`<tr>${td(inp(`settings.accounts.${i}.name`,a.name))}${td(inp(`settings.accounts.${i}.opening`,a.opening,"number"),"n")}${td(`<button class="x" data-rm-acct="${i}">✕</button>`)}</tr>`).join("")}<tr>${td("<i>"+OWNER+"</i>")}${td("n/a","n")}${td("")}</tr></table></div><p class="note"><button class="btn sec" data-act="addAcct">+ Add account</button> · Use "${OWNER}" on an entry when you pay from your own pocket; it counts as capital you put in.</p></div></div>
  <div class="panel"><h2>Expense & money categories</h2><div class="tw"><table>${th(["Category","Type","VAT on purchases",""])}${(s.categories||[]).map((c,i)=>`<tr>${td(inp(`settings.categories.${i}.name`,c.name))}${td(sel(`settings.categories.${i}.type`,c.type,["Ingredients","Packaging","Operating","Equipment","Capital","Drawings","Loan","VAT","Transfer"]))}${td(sel(`settings.categories.${i}.vat`,c.vat,["Standard","Out of scope"]))}${td(`<button class="x" data-rm-cat="${i}">✕</button>`)}</tr>`).join("")}</table></div><p class="note"><button class="btn sec" data-act="addCat">+ Add category</button></p></div>
  <div class="panel"><h2>Data</h2><p class="note">${S.dbOn? "Your data lives in the shared database; everyone who signs in sees and edits the same books." : "No database is configured (see config.js), so data is kept in this browser only."} Export a JSON backup any time.</p><div class="row"><button class="btn sec" data-act="export">Copy backup JSON</button><label class="btn sec" style="display:inline-block">Import backup file <input type="file" id="importFile" accept="application/json" hidden></label><button class="btn sec" data-act="pasteImport">Paste backup JSON</button></div><textarea id="exportBox" hidden style="width:100%;height:120px;margin-top:8px"></textarea>
    <div id="pasteBox" hidden style="margin-top:8px"><textarea id="pasteArea" placeholder="Paste the backup JSON here" style="width:100%;height:120px"></textarea><div class="row" style="margin-top:6px"><button class="btn" data-act="pasteGo">Import pasted backup</button><span class="note">Existing orders, expenses and customers with the same id are replaced; others are kept.</span></div></div></div>`; },
};

// ---------------- editing ----------------
function setPath(path, val){ const parts = path.split("."); let o = S; for (let i=0;i<parts.length-1;i++){ if (o[parts[i]]==null) o[parts[i]] = {}; o = o[parts[i]]; } o[parts[parts.length-1]] = val; }
function bind(){
  const v = $("#view");
  v.querySelectorAll("[data-k]").forEach(el => el.addEventListener("change", () => {
    const k = el.dataset.k; let val = el.value; const key = k.split(".")[0];
    if (el.type==="number") val = el.value==="" ? "" : N(el.value);
    if (k==="settings.vatRate"||k==="settings.targetMargin") val = N(el.value)/100;
    if (k==="settings.vatRegistered"||k==="settings.pricesInclVat") val = el.value==="Yes";
    setPath(k, val); saveConfig(key); render();
  }));
  v.querySelector("#q")?.addEventListener("input", e => { S.q = e.target.value; const t = $("#view table"); render(); const q=$("#q"); q.focus(); q.setSelectionRange(q.value.length,q.value.length); });
  v.querySelector("#dailyM")?.addEventListener("change", e => { S.dailyM = e.target.value; render(); });
  v.querySelector("#bsDate")?.addEventListener("change", e => { S.bsDate = e.target.value; render(); });
  v.querySelectorAll("[data-plan]").forEach(el => el.addEventListener("change", () => { const [n,d]=el.dataset.plan.split(/:(?=\d$)/); S.plan ||= {}; S.plan[n] ||= []; S.plan[n][+d]=N(el.value); try{localStorage.setItem("fofo.plan",JSON.stringify(S.plan));}catch(e){} render(); }));
  v.querySelectorAll("[data-stock]").forEach(el => el.addEventListener("change", () => { S.stock ||= {}; S.stock[el.dataset.stock]=N(el.value); render(); }));
  v.querySelectorAll("[data-scen]").forEach(el => el.addEventListener("change", () => { S.scen ||= {orders:5,aov:55,vc:22,fixed:1700,days:N(C.st.sellingDays),p:0,v:0,c:0}; S.scen[el.dataset.scen]=N(el.value); render(); }));
  v.querySelectorAll("[data-cap]").forEach(el => el.addEventListener("change", () => { S.cap ||= {loaves:10,items:20}; S.cap[el.dataset.cap]=N(el.value); render(); }));
  v.querySelectorAll("[data-goal]").forEach(el => el.addEventListener("change", () => { const [m,k]=el.dataset.goal.split(":"); S.goals[m] ||= {}; S.goals[m][k]=N(el.value); saveConfig("goals"); render(); }));

function compressImage(file){ return new Promise((res, rej) => { const img = new Image(); const url = URL.createObjectURL(file);
  img.onload = () => { URL.revokeObjectURL(url); let w = img.width, h = img.height, max = 1400; const c = document.createElement("canvas");
    const tryEncode = (maxPx, q) => { const sc = Math.min(1, maxPx/Math.max(w,h)); c.width = Math.round(w*sc); c.height = Math.round(h*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height); return c.toDataURL("image/jpeg", q); };
    let out = tryEncode(max, .8); const steps = [[1400,.65],[1100,.6],[900,.55],[700,.5]]; for (const [m,q] of steps){ if (out.length < 230000) break; out = tryEncode(m,q); }
    if (out.length >= 250000) rej(new Error("too large")); else res(out); };
  img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); }; img.src = url; }); }

async function exportExcel(){
  if (!window.XLSX) { toast("Excel library didn't load — check your connection and reload", true); return; }
  const btn = $("#xlsBtn"); btn.disabled = true;
  try {
    const wb = buildWorkbook(); const buf = window.XLSX.write(wb, {bookType:"xlsx", type:"array"});
    const name = `FoFocaccia_Tracker_${today()}.xlsx`;
    downloadBlob(new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), name); toast("Excel file saved");
  } catch(e){ if (e && e.code==="declined") toast("Download cancelled"); else toast("Export failed: "+(e.message||e.code||e), true); }
  btn.disabled = false;
}
$("#xlsBtn").addEventListener("click", exportExcel);
$("#outBtn").addEventListener("click", () => window.FofoStore && window.FofoStore.signOut());
boot();
})();
